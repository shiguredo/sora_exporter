name: Go Test

on:
  push:
    branches-ignore:
      - "main"
    tags-ignore:
      - "*"
    paths:
      - "**.go"
      - "test/**"
      - "go.mod"
      - "go.sum"

jobs:
  build:
    name: go test
    runs-on: ubuntu-24.04
    steps:
      - uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6.0.3

      - name: Set up Go
        uses: actions/setup-go@4a3601121dd01d1626a1e23e37211e3254c1c06c # v6.4.0
        with:
          go-version-file: "./go.mod"

      - run: go version

      - run: go test -v
